# Cloudflare Pages 配置
# 用法：npx wrangler pages deploy dist  （或在 Dashboard 里连接 Git 仓库自动构建）
name = "hoshikuzu-denpatou"
compatibility_date = "2026-11-01"
pages_build_output_dir = "./dist"

# ── 可选：留言板云端存储 ────────────────────────────────
# 想让留言对所有访客可见，就在 Pages 项目里建一个 KV 命名空间，
# 绑定名为 GUESTBOOK，然后取消下面两行注释（id 换成你自己的）。
#
# [[kv_namespaces]]
# binding = "GUESTBOOK"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
